<dialog id="delete-dialog" role="alertdialog" aria-labelledby="delete-title" aria-describedby="delete-desc">
  <div class="dialog-header">
    <h2 id="delete-title">Delete this task?</h2>
  </div>
  <div class="dialog-body">
    <p id="delete-desc">The task will be removed permanently. This cannot be undone.</p>
  </div>
  <div class="dialog-footer">
    <button type="button" class="btn btn-secondary" data-close-dialog autofocus>Cancel</button>
    <button type="button" class="btn btn-danger" id="confirm-delete">Delete task</button>
  </div>
</dialog>
