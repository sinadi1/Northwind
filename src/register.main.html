    <h1>Create account</h1>
    <p>Fields marked <span class="required-mark" aria-hidden="true">*</span><span class="visually-hidden">with an asterisk</span> are required.</p>
    <div id="auth-banner" role="alert"></div>

    <form id="register-form" data-validate data-silent novalidate>
      <div class="field">
        <label for="reg-name">Full name <span class="required-mark" aria-hidden="true">*</span></label>
        <input type="text" id="reg-name" name="name" autocomplete="name" maxlength="80" required aria-describedby="reg-name-error" data-label="Full name">
        <span class="error-message" id="reg-name-error"></span>
      </div>
      <div class="field">
        <label for="reg-email">Email address <span class="required-mark" aria-hidden="true">*</span></label>
        <input type="email" id="reg-email" name="email" autocomplete="email" required aria-describedby="reg-email-error" data-label="Email address">
        <span class="error-message" id="reg-email-error"></span>
      </div>
      <div class="field">
        <label for="reg-password">Password <span class="required-mark" aria-hidden="true">*</span></label>
        <span class="hint" id="reg-password-hint">At least 12 characters, with a letter and a number.</span>
        <input type="password" id="reg-password" name="password" autocomplete="new-password" required minlength="12" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{12,}" aria-describedby="reg-password-hint reg-password-error" data-label="Password" data-pattern-message="Use at least 12 characters, including a letter and a number.">
        <span class="error-message" id="reg-password-error"></span>
      </div>
      <div class="field">
        <label for="reg-confirm">Confirm password <span class="required-mark" aria-hidden="true">*</span></label>
        <input type="password" id="reg-confirm" name="confirm" autocomplete="new-password" required aria-describedby="reg-confirm-error" data-label="Confirm password">
        <span class="error-message" id="reg-confirm-error"></span>
      </div>
      <button type="submit" class="btn">Create account</button>
      <p role="status" data-form-status></p>
    </form>

    <p>Already registered? <a href="login.html">Sign in</a>.</p>
